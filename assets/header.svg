<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3b341"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#3fb950" fill-opacity="0.7"/>
    </marker>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .curve { stroke-dasharray: 760; stroke-dashoffset: 760; animation: draw 2.4s ease-out forwards; }
        .fade { opacity: 0; animation: fade 0.6s ease-out forwards; }
        .d1 { animation-delay: 1.0s } .d2 { animation-delay: 1.5s } .d3 { animation-delay: 2.0s }
        .link { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 0.8s ease-out forwards; }
        .l1 { animation-delay: 0.2s } .l2 { animation-delay: 0.6s } .l3 { animation-delay: 1.0s } .l4 { animation-delay: 1.4s }
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0b1a14"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- left: name and tagline -->
  <text x="64" y="118" font-size="54" font-weight="700" fill="#e6edf3">Varun Moka</text>
  <text x="64" y="164" font-size="24" fill="#9ad3a6">Climate numbers should be easy to check.</text>
  <text x="64" y="202" font-size="17" fill="#7d8b84">Founder, GoCarbonTracker · Berlin</text>
  <text x="64" y="242" font-size="16" fill="#7d8b84">Supplier emissions, Scope 1 to 3, every figure traced to its page.</text>

  <!-- right: emissions curve to net zero -->
  <g>
    <path d="M640 60 C 760 66, 820 140, 900 176 S 1060 206, 1130 210 L1130 210 L640 210 Z" fill="url(#area)" class="fade d2"/>
    <path d="M640 60 C 760 66, 820 140, 900 176 S 1060 206, 1130 210" fill="none" stroke="url(#curve)" stroke-width="4" stroke-linecap="round" class="curve"/>
    <line x1="624" y1="210" x2="1150" y2="210" stroke="#3fb950" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 6"/>
    <text x="1150" y="226" font-size="14" fill="#3fb950" text-anchor="end" class="fade d3">net zero</text>

    <!-- traced figures on the curve -->
    <g class="fade d1">
      <circle cx="700" cy="68" r="5" fill="#0b1a14" stroke="#e3b341" stroke-width="2.5"/>
      <text x="712" y="58" font-size="14" fill="#e3b341">p. 61</text>
    </g>
    <g class="fade d2">
      <circle cx="860" cy="152" r="5" fill="#0b1a14" stroke="#e3b341" stroke-width="2.5"/>
      <text x="872" y="146" font-size="14" fill="#e3b341">p. 118</text>
    </g>
    <g class="fade d3">
      <circle cx="1010" cy="200" r="5" fill="#0b1a14" stroke="#3fb950" stroke-width="2.5"/>
      <text x="1022" y="194" font-size="14" fill="#3fb950">p. 203</text>
    </g>
  </g>

  <!-- supply chain below the curve -->
  <g>
    <line x1="668" y1="262" x2="762" y2="262" stroke="#3fb950" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arrow)" class="link l1"/>
    <line x1="778" y1="262" x2="872" y2="262" stroke="#3fb950" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arrow)" class="link l2"/>
    <line x1="888" y1="262" x2="982" y2="262" stroke="#3fb950" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arrow)" class="link l3"/>
    <line x1="998" y1="262" x2="1092" y2="262" stroke="#3fb950" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arrow)" class="link l4"/>

    <circle cx="660" cy="262" r="7" fill="#0b1a14" stroke="#3fb950" stroke-width="2"/>
    <circle cx="770" cy="262" r="7" fill="#0b1a14" stroke="#3fb950" stroke-width="2"/>
    <circle cx="880" cy="262" r="7" fill="#0b1a14" stroke="#3fb950" stroke-width="2"/>
    <circle cx="990" cy="262" r="7" fill="#0b1a14" stroke="#3fb950" stroke-width="2"/>
    <circle cx="1100" cy="262" r="8" fill="#e3b341"/>

    <text x="660" y="288" font-size="14" fill="#7d8b84" text-anchor="middle">Tier 3</text>
    <text x="770" y="288" font-size="14" fill="#7d8b84" text-anchor="middle">Tier 2</text>
    <text x="880" y="288" font-size="14" fill="#7d8b84" text-anchor="middle">Tier 1</text>
    <text x="990" y="288" font-size="14" fill="#7d8b84" text-anchor="middle">Procurement</text>
    <text x="1100" y="288" font-size="14" fill="#e3b341" text-anchor="middle">Scope 3</text>
  </g>
</svg>
